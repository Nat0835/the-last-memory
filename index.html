<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Last Memory</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>

        <!-- SCENE 1 -->
        <section id="scene1" class="scene active">

            <h1>THE LAST MEMORY</h1>

            <p>Click anywhere to begin.</p>

        </section>


        <!-- SCENE 2 -->
        <section id="scene2" class="scene">

            <h2>Turn the clock back.</h2>

            <div id="clock">
                <div id="clock-hand"></div>
            </div>

            <p>Drag the hand backward.</p>

        </section>


        <!-- SCENE 3 -->
        <section id="scene3" class="scene">

            <h2>Find what you remember.</h2>

            <div id="memory">

                <div id="memory-cover"></div>

            </div>

            <p>Move your cursor across the image.</p>

        </section>


        <!-- SCENE 4 -->
        <section id="scene4" class="scene">

            <h2>Something is missing.</h2>

            <p>Put the memory back together.</p>

        </section>


        <!-- SCENE 5 -->
        <section id="scene5" class="scene">

            <h2>Maybe remembering isn't about keeping something.</h2>

            <p>Maybe it's about watching it change.</p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
